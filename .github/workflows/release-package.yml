# ============================================================
# KubeJS 发版打包工作流
# ============================================================
# 触发时机：GitHub Release 正式发布时（仅一次）
#
# 功能：
#   Job 1 - 按白名单过滤需要打包的文件夹/文件，压缩为 KubeJS-脚本包.zip
#   Job 2 - 打包 ./tacz所有的枪械配件数据/ 目录，压缩为 TACZ枪械配件数据-<tag>.zip
#   两者均自动上传到当前 Release 的附件
# ============================================================

name: KubeJS 发版打包

on:
  # 仅在 Release 正式发布时触发一次（draft/edit 不会触发）
  release:
    types: [published]

# ============================================================
# 白名单配置区 ⬇️ 在此修改需要打包的文件夹/文件
# ============================================================
env:
  PACKAGE_NAME: "KubeJS-${{ github.event.release.tag_name }}"

jobs:
  # ============================================================
  # Job 1: KubeJS 脚本包
  # ============================================================
  package-and-upload:
    name: 打包 KubeJS 脚本包并上传
    runs-on: ubuntu-latest
    # 必须显式声明写入权限，否则 GITHUB_TOKEN 无法上传 Release 附件
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 创建打包暂存目录
        run: mkdir -p build

      # ===== 复制白名单文件夹 =====
      - name: 复制白名单文件夹
        run: |
          # ⭐ 在此添加需要打包的文件夹（用空格分隔）
          DIRS="startup_scripts server_scripts client_scripts assets data config"
          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              echo "添加文件夹: $dir"
              cp -r "$dir" "build/$dir"
            else
              echo "文件夹不存在，跳过: $dir"
            fi
          done

      # ===== 复制白名单文件 =====
      - name: 复制白名单根目录文件
        run: |
          # ⭐ 在此添加需要打包的根目录文件（用空格分隔）
          FILES="README.txt LICENSE 海战参数迁移更新日志.md 更新日志.md"
          for file in $FILES; do
            if [ -f "$file" ]; then
              echo "添加文件: $file"
              cp "$file" "build/$file"
            else
              echo "文件不存在，跳过: $file"
            fi
          done

      # ===== 生成版本信息 =====
      - name: 生成版本信息
        run: |
          echo "version=${{ github.event.release.tag_name || github.ref_name }}" > build/version.txt
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> build/version.txt
          echo "commit=${{ github.sha }}" >> build/version.txt
          echo "已生成 build/version.txt"

      # ===== 压缩打包 =====
      - name: 压缩为 ZIP
        run: |
          cd build
          zip -r "../${{ env.PACKAGE_NAME }}.zip" ./*
          cd ..
          echo "压缩完成: ${{ env.PACKAGE_NAME }}.zip"
          echo "大小: $(du -h ${{ env.PACKAGE_NAME }}.zip | cut -f1)"

      # ===== 上传到 Release =====
      - name: 上传 KubeJS 脚本包到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_NAME }}.zip

  # ============================================================
  # Job 2: TACZ 枪械配件数据表
  # ============================================================
  tacz-data-upload:
    name: 打包 TACZ 枪械配件数据表并上传
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 复制 TACZ 枪械配件数据目录
        run: |
          SRC="tacz所有的枪械配件数据"
          if [ -d "$SRC" ]; then
            echo "找到目录: $SRC"
            cp -r "$SRC" "TACZ枪械配件数据-${{ github.event.release.tag_name }}"
            echo "复制完成"
          else
            echo "目录不存在: $SRC"
            exit 1
          fi

      - name: 压缩为 ZIP
        run: |
          ZIP_NAME="TACZ枪械配件数据-${{ github.event.release.tag_name }}.zip"
          zip -r "$ZIP_NAME" "TACZ枪械配件数据-${{ github.event.release.tag_name }}"
          echo "压缩完成: $ZIP_NAME"
          echo "大小: $(du -h $ZIP_NAME | cut -f1)"

      - name: 上传 TACZ 数据表到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: TACZ枪械配件数据-${{ github.event.release.tag_name }}.zip

  
  kubjs-data-upload:
    name: 打包 KubeJS client 并上传
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 复制 KubeJS 客户端目录
        run: |
          SRC="kubejs-client"
          if [ -d "$SRC" ]; then
            echo "找到目录: $SRC"
            cp -r "$SRC" "KubeJS-client-${{ github.event.release.tag_name }}"
            echo "复制完成"
          else
            echo "目录不存在: $SRC"
            exit 1
          fi

      - name: 压缩为 ZIP
        run: |
          ZIP_NAME="KubeJS-client-${{ github.event.release.tag_name }}.zip"
          zip -r "$ZIP_NAME" "KubeJS-client-${{ github.event.release.tag_name }}"
          echo "压缩完成: $ZIP_NAME"
          echo "大小: $(du -h $ZIP_NAME | cut -f1)"

      - name: 上传 KubeJS 客户端到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: KubeJS-client-${{ github.event.release.tag_name }}.zip
